services:
  # ===== MEDIA AUTOMATION STACK =====

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/Edmonton
    volumes:
      - /Users/pt/docker-configs/sonarr:/config
      - /Volumes/Media:/data
    ports:
      - 8989:8989
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/Edmonton
    volumes:
      - /Users/pt/docker-configs/radarr:/config
      - /Volumes/Media:/data
    ports:
      - 7878:7878
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/Edmonton
    volumes:
      - /Users/pt/docker-configs/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  bookshelf:
    image: ghcr.io/pennydreadful/bookshelf:hardcover
    container_name: bookshelf
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/Edmonton
    volumes:
      - /Users/pt/docker-configs/bookshelf:/config
      - /Volumes/Media:/data
    ports:
      - 8787:8787
    restart: unless-stopped

  whisparr:
