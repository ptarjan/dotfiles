  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/Edmonton
    volumes:
      - /Users/pt/docker-configs/overseerr:/config
    ports:
      - 5055:5055
    restart: unless-stopped

  azeroth-auction-assassin:
    build:
      # upstream clone (git pull to update); has fixes for Blizzard's
      # lowercase last-modified header and the Saddlebag API schema change
      context: /Users/pt/github/AzerothAuctionAssassin
      dockerfile: Dockerfile
    container_name: azerothauctionassassin
    environment:
      - TZ=America/Edmonton
    restart: always
    volumes:
      - /Users/pt/docker-configs/aaa/mega_data.json:/app/AzerothAuctionAssassinData/mega_data.json
