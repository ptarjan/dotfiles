      - /Users/pt/docker-configs/aaa/desired_items.json:/app/AzerothAuctionAssassinData/desired_items.json
      - /Users/pt/docker-configs/aaa/desired_ilvl.json:/app/AzerothAuctionAssassinData/desired_ilvl.json
