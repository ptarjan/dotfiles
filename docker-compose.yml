  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - TZ=America/Edmonton
    ports:
      - 8191:8191
    restart: unless-stopped

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/Edmonton
    volumes:
      - /Users/pt/docker-configs/tautulli:/config
    ports:
