  decluttarr:
    image: ghcr.io/manimatter/decluttarr:latest
    container_name: decluttarr
    environment:
      - TZ=America/Edmonton
      - PUID=501
      - PGID=20
    volumes:
      - /Users/pt/docker-configs/decluttarr/config.yaml:/app/config/config.yaml
      - /Volumes/Media:/data
    restart: unless-stopped

  ownfoil:
    image: a1ex4/ownfoil:latest
    container_name: ownfoil
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/Edmonton
      - USER_ADMIN_NAME=pt
      - USER_ADMIN_PASSWORD=92LsVCDZx1m2JBh
      - USER_GUEST_NAME=switch
      - USER_GUEST_PASSWORD=e4027749
    volumes:
      - /Volumes/Media/Switch:/games
      - /Users/pt/docker-configs/ownfoil/config:/app/config
      - /Users/pt/docker-configs/ownfoil/data:/app/data
    ports:
      - 8465:8465
    restart: unless-stopped

  gamarr:
    image: ghcr.io/gamarr-app/gamarr:nightly
    container_name: gamarr
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/Edmonton
    volumes:
      - /Users/pt/docker-configs/gamarr:/config
      - /Volumes/Media:/data
      - /Users/pt/docker-configs/gamarr/custom-cont-init.d:/custom-cont-init.d:ro
    ports:
      - 6767:6767
    restart: unless-stopped

