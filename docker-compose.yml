      - PUID=501
      - PGID=20
      - TZ=America/Edmonton
    volumes:
      - /Users/pt/docker-configs/whisparr:/config
      - /Volumes/Media:/data
    ports:
      - 6969:6969
    restart: unless-stopped

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    env_file:
      - /Users/pt/docker-configs/transmission/.env
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/Edmonton
    volumes:
      - /Users/pt/docker-configs/transmission:/config
      - /Volumes/Media:/data
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped

  # Disabled 2026-05-31: only filter (LegalPorno/AnalVids) was off since Feb and
  # its RSS feeds (esp. 1337x @ 5min) were rate-limiting indexers for no benefit.
